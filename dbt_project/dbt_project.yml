name: project_dbt
version: "1.0.0"
profile: project_dbt         # must match the top key in profiles.yml

#model-paths: ["models"]
seed-paths: ["seeds"]
#snapshot-paths: ["snapshots"]
#test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

vars:
  date_spine_start: "2000-01-01"  # vanim hankeleping on aastast 2003
  date_spine_end: "2031-01-01"

models:
  project_dbt:
    #+materialized: table
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: staging
    marts:
      +materialized: table
      +schema: dwh

seeds:
  project_dbt:
    +schema: raw             # seeds land in the "raw" schema so they are
                             # clearly separate from the modeled tables
    raw_companies:
      +column_types:
        company_id: varchar(100)
        company_name: text
        registration_code: integer
        registration_date: text
        sector_code: varchar(100)
        valid_from: text
        valid_to: text
        is_current: integer

    raw_sectors:
      +column_types:
        sector_code: varchar(100)
        sector_name: text
