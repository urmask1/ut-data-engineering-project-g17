name: project_dbt
version: "1.0.0"
profile: project_dbt         # must match the top key in profiles.yml

#model-paths: ["models"]
seed-paths: ["seeds"]
#snapshot-paths: ["snapshots"]
#test-paths: ["tests"]
target-path: "target"
clean-targets: ["target"]

models:
  project_dbt:
    +materialized: table

seeds:
  project_dbt:
    +schema: raw             # seeds land in the "raw" schema so they are
                             # clearly separate from the modeled tables
    raw_companies:
      +column_types:
        company_id: varchar(100)
        company_name: text
        registration_code: integer
        registration_date: text
        sector_code: varchar(100)
        valid_from: text
        valid_to: text
        is_current: integer

    raw_sectors:
      +column_types:
        sector_code: varchar(100)
        sector_name: text
